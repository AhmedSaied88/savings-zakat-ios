name: Native iOS build and tests
on:
  pull_request:
    paths:
      - 'SavingsZakat/**'
      - 'SavingsZakatTests/**'
      - 'SavingsZakatUITests/**'
      - 'Documentation/**'
      - 'project.yml'
      - '.github/workflows/ios-test.yml'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'SavingsZakat/**'
      - 'SavingsZakatTests/**'
      - 'SavingsZakatUITests/**'
      - 'Documentation/**'
      - 'project.yml'
      - '.github/workflows/ios-test.yml'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app and test bundles
        run: |
          PROJECT="$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          xcodebuild build-for-testing -project "$PROJECT" -scheme SavingsZakat -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

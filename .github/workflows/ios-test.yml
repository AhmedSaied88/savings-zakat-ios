name: Native iOS build and tests
on:
  pull_request:
    paths:
      - 'SavingsZakat/**'
      - 'SavingsZakatTests/**'
      - 'Documentation/**'
      - 'project.yml'
      - '.github/workflows/ios-test.yml'
  push:
    branches:
      - main
    paths:
      - 'SavingsZakat/**'
      - 'SavingsZakatTests/**'
      - 'Documentation/**'
      - 'project.yml'
      - '.github/workflows/ios-test.yml'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and run unit tests
        run: xcodebuild test -project SavingsZakat.xcodeproj -scheme SavingsZakat -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO

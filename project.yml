name: Savings Zakat
options:
  bundleIdPrefix: com.ahmedsaied88
  deploymentTarget:
    iOS: '17.0'
targets:
  SavingsZakat:
    type: application
    platform: iOS
    sources:
      - path: SavingsZakat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedsaied88.savingszakat.test
        PRODUCT_NAME: Savings & Zakat Test
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Savings & Zakat Test
        CODE_SIGN_STYLE: Automatic
  SavingsZakatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SavingsZakatTests
    dependencies:
      - target: SavingsZakat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedsaied88.savingszakat.tests
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: YES
